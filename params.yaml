data:
  raw_data_path: data/raw/PetImages
  processed_data_path: data/processed

  train_split: 0.7
  val_split: 0.15
  test_split: 0.15

  image_size: 224
  batch_size: 32

  random_seed: 42
  classes:
    - Cat
    - Dog

training:
  epochs: 10
  learning_rate: 0.001

model:
  name: resnet50
  pretrained: true
  num_classes: 2

paths:
  model_path: models/best_model.pth